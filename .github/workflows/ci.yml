name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Compile Python sources
        run: python -m compileall -q .

  api-smoke:
    name: API smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements_sklearn.txt
      - name: Install API dependencies
        run: python -m pip install -r requirements_sklearn.txt
      - name: Exercise model startup and prediction
        run: |
          python - <<'PY'
          import main

          payload = {
              "Pregnancies": 2,
              "Glucose": 120,
              "BloodPressure": 70,
              "SkinThickness": 20,
              "Insulin": 79,
              "BMI": 32.0,
              "DiabetesPedigreeFunction": 0.5,
              "Age": 30,
          }

          assert main.initialize_model() is True
          response = main.predict(main.PatientData(**payload))
          assert response["prediction"] in (0, 1)
          assert 0 <= response["probability"] <= 1
          PY
